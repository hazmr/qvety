spring:
  application:
    name: qvety
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        default_batch_fetch_size: 16   # LAZY @ManyToOne loads in batches, not one select per row
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      db_name: qvety
      app_password: ${DB_APP_PASSWORD:}   # role password for qvety_app; required outside local
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false   # unknown Accept-Language falls back to messages.properties (English)
  web:
    locale: en
    locale-resolver: accept_header
  data:
    web:
      pageable:
        max-page-size: 100
        serialization-mode: via_dto   # PagedModel: {content, page:{size,number,totalElements,totalPages}}, a stable shape
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  mime-mappings:
    webmanifest: application/manifest+json
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

qvety:
  jwt:
    secret: ${QVETY_JWT_SECRET:}   # required outside the local profile; the app refuses to start without it
    ttl: 12h

springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/**   # the document describes the API only, not the viewer's own routes
