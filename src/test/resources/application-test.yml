# Test profile. Datasource comes from Testcontainers via @ServiceConnection.
spring:
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    placeholders:
      app_password: qvety_app

qvety:
  jwt:
    secret: test-only-secret-not-for-production-0123456789abcdef
    ttl: 12h

logging:
  level:
    com.qvety: DEBUG
