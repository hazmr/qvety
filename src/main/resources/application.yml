spring:
  application:
    name: qvety
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      db_name: qvety
      app_password: ${DB_APP_PASSWORD:}   # role password for qvety_app; required outside local
  data:
    web:
      pageable:
        max-page-size: 100
  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

qvety:
  jwt:
    secret: ${QVETY_JWT_SECRET:}   # required outside the local profile; the app refuses to start without it
    ttl: 12h

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
