name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest   # Docker is available here; Testcontainers needs it
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build and test
        run: ./mvnw -B verify

      # The tenant boundary is a required check: the build is red unless TenantIsolationIT ran and passed.
      - name: Tenant isolation ran and passed
        if: always()
        run: |
          report=target/failsafe-reports/TEST-com.qvety.tenant.TenantIsolationIT.xml
          test -f "$report" || { echo "TenantIsolationIT did not run"; exit 1; }
          grep -q 'errors="0"' "$report" && grep -q 'failures="0"' "$report" \
            || { echo "TenantIsolationIT failed"; exit 1; }
