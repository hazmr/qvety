# Local development. Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/qvety
    username: qvety_owner
    password: qvety_owner
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  jpa:
    show-sql: false

qvety:
  jwt:
    secret: local-dev-only-secret-not-for-production-0123456789

logging:
  level:
    com.qvety: DEBUG
    org.flywaydb: INFO
