# Local development only. Production compose lives in deploy/ (part 16).
services:
  postgres:
    image: postgres:18
    container_name: qvety-postgres
    environment:
      POSTGRES_DB: qvety
      POSTGRES_USER: qvety_owner
      POSTGRES_PASSWORD: qvety_owner
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qvety_owner -d qvety"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: qvety-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qvety
      MINIO_ROOT_PASSWORD: qvety-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # Part 11. Nightly pg_dump to MinIO at 03:00 Cairo, kept 30 days. The same image and script run in
  # production (part 16); here it exists so the restore drill can be rehearsed against real dumps.
  backup:
    build: ./backup
    container_name: qvety-backup
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      TZ: Africa/Cairo
      PGHOST: postgres
      PGUSER: qvety_owner
      PGPASSWORD: qvety_owner
      PGDATABASE: qvety
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: qvety
      MINIO_SECRET_KEY: qvety-minio
      BACKUP_BUCKET: qvety-backups
      RETENTION_DAYS: "30"

volumes:
  postgres-data:
  minio-data:
