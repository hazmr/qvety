# Production. Every value below comes from the environment; the app refuses to start without them.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    locations: classpath:db/migration
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}

# Only the reverse proxy reaches Tomcat, so its X-Forwarded-* headers are trusted for the remote address
# (login rate limiting) and the scheme. Not set locally: the socket address is already the client.
server:
  forward-headers-strategy: native

# Neither the OpenAPI document nor a viewer is served in production.
springdoc:
  api-docs:
    enabled: false

logging:
  level:
    com.qvety: INFO
