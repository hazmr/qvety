# Local development only. Production compose lives in deploy/ (part 16).
services:
  postgres:
    image: postgres:18
    container_name: qvety-postgres
    environment:
      POSTGRES_DB: qvety
      POSTGRES_USER: qvety_owner
      POSTGRES_PASSWORD: qvety_owner
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qvety_owner -d qvety"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio
    container_name: qvety-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: qvety
      MINIO_ROOT_PASSWORD: qvety-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
