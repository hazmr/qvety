<div class="login">
  <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()" class="login__card">
    <div class="login__top">
      <img src="brand/mark.svg" alt="" class="login__mark" />
      <h1 class="login__title">{{ 'login.title' | transloco }}</h1>
      <button type="button" class="login__lang" (click)="toggleLanguage()">{{ 'app.language' | transloco }}</button>
    </div>
    @if (error(); as e) {
      <nz-alert nzType="error" [nzMessage]="e" nzShowIcon class="login__alert" />
    }
    <nz-form-item>
      <nz-form-label nzFor="identifier" nzRequired>{{ 'login.identifier' | transloco }}</nz-form-label>
      <nz-form-control [nzErrorTip]="'login.identifierHint' | transloco">
        <input nz-input id="identifier" type="text" formControlName="identifier" autocomplete="username" inputmode="email" dir="ltr" class="ltr-field" placeholder="01xxxxxxxxx" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label nzFor="password" nzRequired>{{ 'login.password' | transloco }}</nz-form-label>
      <nz-form-control [nzErrorTip]="'login.passwordHint' | transloco">
        <input nz-input id="password" type="password" formControlName="password" autocomplete="current-password" dir="ltr" class="ltr-field" />
      </nz-form-control>
    </nz-form-item>
    <button nz-button nzType="primary" nzBlock [nzLoading]="busy()" type="submit">{{ 'login.submit' | transloco }}</button>
  </form>
</div>
