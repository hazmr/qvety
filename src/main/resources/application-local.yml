# Local development. Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=local
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/qvety
    username: qvety_app        # the application never connects as the owner
    password: qvety_app
  flyway:
    locations: classpath:db/migration,classpath:db/seed
    user: qvety_owner
    password: qvety_owner
    placeholders:
      app_password: qvety_app
  jpa:
    show-sql: false

qvety:
  jwt:
    secret: local-dev-only-secret-not-for-production-0123456789

# API reference at /scalar; off everywhere else. No CDN fonts and no telemetry so the page stays inside the CSP.
scalar:
  enabled: true
  url: /v3/api-docs
  with-default-fonts: false
  telemetry: false

logging:
  level:
    com.qvety: DEBUG
    org.flywaydb: INFO
