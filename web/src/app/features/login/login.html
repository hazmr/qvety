<div class="login">
  <form nz-form nzLayout="vertical" [formGroup]="form" (ngSubmit)="submit()" class="login__card">
    <h1 class="login__title">Qvety</h1>
    @if (error(); as e) {
      <nz-alert nzType="error" [nzMessage]="e" nzShowIcon class="login__alert" />
    }
    <nz-form-item>
      <nz-form-label nzFor="identifier" nzRequired>Phone or email</nz-form-label>
      <nz-form-control nzErrorTip="Enter your phone number or email">
        <input nz-input id="identifier" type="text" formControlName="identifier" autocomplete="username" inputmode="email" dir="ltr" placeholder="01xxxxxxxxx" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <nz-form-label nzFor="password" nzRequired>Password</nz-form-label>
      <nz-form-control nzErrorTip="Enter your password">
        <input nz-input id="password" type="password" formControlName="password" autocomplete="current-password" dir="ltr" />
      </nz-form-control>
    </nz-form-item>
    <button nz-button nzType="primary" nzBlock [nzLoading]="busy()" type="submit">Log in</button>
  </form>
</div>
